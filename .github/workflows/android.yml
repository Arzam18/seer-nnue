name: Build Seer for Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'syzygy/**'
      - 'incbin/**'
      - 'build/makefile'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ============================================================
      # ANDROID NDK
      # NDK r27c = 27.2.12479018
      # ============================================================
      - name: Install Android NDK r27c
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o android-ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r27c" >> "$GITHUB_ENV"

      # ============================================================
      # NETWORK
      # ============================================================
      - name: Download Seer network
        run: |
          mkdir -p build/weights
          curl -fL --retry 3 --retry-delay 2 \
            -o build/weights/q0x2291e0ff.bin \
            https://github.com/connormcmonigle/seer-training/releases/download/0x2291e0ff/q0x2291e0ff.bin
          test -s build/weights/q0x2291e0ff.bin

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build ARM64 NEON
        run: |
          cd build
          make clean || true

          make binary \
            CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" \
            CXXFLAGS="-std=c++17 -O3 -DNDEBUG -fconstexpr-steps=1000000000 -Wall -Wextra -pedantic -march=armv8-a+simd -fopenmp-simd -static-libstdc++ -DEVALFILE=\"weights/q0x2291e0ff.bin\"" \
            LDFLAGS=""

      # ============================================================
      # VERIFY
      # ============================================================
      - name: Verify ARM64 binary
        run: |
          file build/seer
          readelf -h build/seer | grep -E 'Class:|Machine:'
          chmod +x build/seer
          printf 'uci\nisready\nquit\n' | timeout 30 ./build/seer

      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload ARM64 NEON artifact
        uses: actions/upload-artifact@v4
        with:
          name: seer-android-arm64-neon
          path: build/seer
          if-no-files-found: error

      # ============================================================
      # PRE-RELEASE
      # ============================================================
      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Seer Android ARM64 NEON Build ${{ github.run_number }}
          prerelease: true
          files: build/seer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
