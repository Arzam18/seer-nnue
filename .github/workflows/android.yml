name: Seer

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Locate Makefile
        run: |
          MAKEFILE_PATH=$(find . -iname "makefile" | head -n 1)
          echo "Found makefile at: $MAKEFILE_PATH"
          MAKEFILE_DIR=$(dirname "$MAKEFILE_PATH")
          echo "MAKEFILE_DIR=$MAKEFILE_DIR" >> $GITHUB_ENV

      - name: Download sse2neon Header
        run: |
          mkdir -p include
          curl -sL https://raw.githubusercontent.com/DLTcollab/sse2neon/master/sse2neon.h -o include/sse2neon.h

      - name: Patch SIMD headers for ARM
        run: |
          python3 -c '
          import os

          def patch_file(path):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              original = content

              if "<x86intrin.h>" in content:
                  content = content.replace("<x86intrin.h>", "\"sse2neon.h\"")

              if content != original:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Patched: {path}")

          for root, dirs, files in os.walk("include"):
              for file in files:
                  if file.endswith((".h", ".hpp", ".cpp", ".c", ".cc")):
                      patch_file(os.path.join(root, file))
          '

      - name: Patch attribute ordering for Clang
        run: |
          sed -i 's/__attribute__((no_sanitize("thread"))) \[\[maybe_unused\]\] transposition_table\& insert/[[maybe_unused]] __attribute__((no_sanitize("thread"))) transposition_table\& insert/' include/search/transposition_table.h
          sed -i 's/__attribute__((no_sanitize("thread"))) \[\[nodiscard\]\] std::optional<transposition_table_entry> find/[[nodiscard]] __attribute__((no_sanitize("thread"))) std::optional<transposition_table_entry> find/' include/search/transposition_table.h

      - name: Build
        run: |
          cd "$MAKEFILE_DIR"
          make CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++ \
               CXXFLAGS="-std=c++17 -O3 -DNDEBUG -fconstexpr-steps=1000000000 -DEVALFILE=\\\"weights/q0x2291e0ff.bin\\\" -Wall -Wextra -pedantic --target=aarch64-linux-android28 -march=armv8-a+simd -static-libstdc++" \
               LDFLAGS="-lpthread"

      - name: Locate and Move Binary
        run: |
          mkdir -p dist
          BINARY_PATH=$(find . -maxdepth 5 -iname "seer" -type f ! -path "*/.*")
          if [ -z "$BINARY_PATH" ]; then
            echo "Error: Seer binary could not be found after compilation."
            exit 1
          fi
          echo "Found binary at: $BINARY_PATH"
          cp "$BINARY_PATH" dist/seer
          chmod +x dist/seer
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seer-android-arm64
          path: dist/seer

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Seer Build ${{ github.run_number }}
          prerelease: true
          files: dist/seer
