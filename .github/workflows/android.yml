name: Seer

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ============================================================
      # INSTALL ANDROID NDK
      # ============================================================
      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> "$GITHUB_ENV"

      # ============================================================
      # DOWNLOAD NNUE
      # ============================================================
      - name: Download Seer NNUE
        run: |
          mkdir -p build/weights

          wget -q \
            -O build/weights/q0x2291e0ff.bin \
            https://github.com/connormcmonigle/seer-training/releases/download/0x2291e0ff/q0x2291e0ff.bin

          ls -lh build/weights/q0x2291e0ff.bin

      # ============================================================
      # DOWNLOAD SSE2NEON
      # ============================================================
      - name: Download sse2neon Header
        run: |
          curl -L \
            https://raw.githubusercontent.com/DLTcollab/sse2neon/master/sse2neon.h \
            -o include/sse2neon.h

      # ============================================================
      # PATCH SIMD HEADERS
      # ============================================================
      - name: Patch SIMD headers for ARM
        run: |
          python3 - <<'PY'
          import os

          for root, dirs, files in os.walk("include"):
              for file in files:
                  if not file.endswith((".h", ".hpp", ".cpp", ".c", ".cc")):
                      continue

                  path = os.path.join(root, file)

                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()

                  original = content

                  content = content.replace(
                      "<x86intrin.h>",
                      '"sse2neon.h"'
                  )

                  if content != original:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)

                      print("Patched:", path)
          PY

      # ============================================================
      # PATCH CLANG ATTRIBUTES
      # ============================================================
      - name: Patch attribute ordering for Clang
        run: |
          sed -i \
            's/__attribute__((no_sanitize("thread"))) \[\[maybe_unused\]\] transposition_table\& insert/[[maybe_unused]] __attribute__((no_sanitize("thread"))) transposition_table\& insert/' \
            include/search/transposition_table.h

          sed -i \
            's/__attribute__((no_sanitize("thread"))) \[\[nodiscard\]\] std::optional<transposition_table_entry> find/[[nodiscard]] __attribute__((no_sanitize("thread"))) std::optional<transposition_table_entry> find/' \
            include/search/transposition_table.h

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build Seer ARM64 NEON
        run: |
          set -o pipefail

          cd build

          make clean || true

          make \
            CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" \
            CXXFLAGS="-std=c++17 -O3 -DNDEBUG -fconstexpr-steps=1000000000 -DEVALFILE=\\\"weights/q0x2291e0ff.bin\\\" -Wall -Wextra -pedantic -march=armv8-a+simd -fopenmp-simd" \
            2>&1 | tee ../seer-build.log

      # ============================================================
      # VERIFY BINARY
      # ============================================================
      - name: Verify binary
        run: |
          set -e

          echo "Generated files:"
          find build -maxdepth 1 -type f -ls

          if [ ! -f build/seer ]; then
            echo "ERROR: build/seer was not created."
            exit 1
          fi

          chmod +x build/seer

          echo
          echo "Binary:"
          ls -lh build/seer

          echo
          echo "File type:"
          file build/seer

      # ============================================================
      # VERIFY ARM64
      # ============================================================
      - name: Verify ARM64
        run: |
          set -e

          file build/seer

          if ! file build/seer | grep -Eiq 'ARM aarch64|ARM64'; then
            echo "ERROR: Binary is not ARM64."
            exit 1
          fi

          echo "ARM64 verification successful."

      # ============================================================
      # PREPARE SINGLE-BINARY ARTIFACT
      # ============================================================
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp build/seer artifact/seer
          chmod +x artifact/seer

          ls -lh artifact/seer

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seer-android-arm64-neon
          path: artifact/seer
          if-no-files-found: error

      # ============================================================
      # CREATE PRERELEASE
      # ============================================================
      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Seer Android ARM64 NEON Build ${{ github.run_number }}
          prerelease: true
          files: artifact/seer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
